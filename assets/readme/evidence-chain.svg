<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="310" viewBox="0 0 1120 310" role="img" aria-labelledby="title desc">
  <title id="title">从材料主张到投资决策的证据链</title>
  <desc id="desc">合成示意：项目材料经过证据分类、状态跟踪后，影响估值、条款与投决。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F8FC"/>
      <stop offset="100%" stop-color="#EDF3FA"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172B4D" flood-opacity=".08"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1118" height="308" rx="24" fill="url(#bg)" stroke="#DFE7F1"/>
  <text x="38" y="48" fill="#12233F" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">让证据状态跟着问题走</text>
  <text x="38" y="73" fill="#63748B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">合成示意 · 管理层回答会更新问题，但不会自动变成独立验证</text>

  <g filter="url(#shadow)">
    <rect x="38" y="112" width="228" height="126" rx="16" fill="#FFFFFF"/>
    <rect x="294" y="112" width="228" height="126" rx="16" fill="#FFFFFF"/>
    <rect x="550" y="112" width="228" height="126" rx="16" fill="#FFFFFF"/>
    <rect x="806" y="112" width="276" height="126" rx="16" fill="#FFFFFF"/>
  </g>
  <path d="M270 175 H286" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M526 175 H542" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M782 175 H798" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="64" cy="140" r="13" fill="#E8EFFB"/>
  <text x="64" y="144" text-anchor="middle" fill="#3158A8" font-family="Inter, sans-serif" font-size="10" font-weight="700">01</text>
  <text x="86" y="145" fill="#64748B" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing=".7">来源材料</text>
  <text x="58" y="180" fill="#172B4D" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700">客户进度说明</text>
  <text x="58" y="207" fill="#64748B" font-family="Inter, -apple-system, sans-serif" font-size="12">BP 第 12 页 · 原文定位</text>

  <circle cx="320" cy="140" r="13" fill="#FFF2D9"/>
  <text x="320" y="144" text-anchor="middle" fill="#A56408" font-family="Inter, sans-serif" font-size="10" font-weight="700">02</text>
  <text x="342" y="145" fill="#64748B" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing=".7">证据分类</text>
  <text x="314" y="180" fill="#172B4D" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700">管理层主张</text>
  <text x="314" y="207" fill="#64748B" font-family="Inter, -apple-system, sans-serif" font-size="12">“客户已完成定点”</text>

  <circle cx="576" cy="140" r="13" fill="#FDE8E7"/>
  <text x="576" y="144" text-anchor="middle" fill="#B54742" font-family="Inter, sans-serif" font-size="10" font-weight="700">03</text>
  <text x="598" y="145" fill="#64748B" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing=".7">核验状态</text>
  <text x="570" y="180" fill="#A43A36" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700">已回答 · 未验证</text>
  <text x="570" y="207" fill="#64748B" font-family="Inter, -apple-system, sans-serif" font-size="12">缺客户确认或订单证据</text>

  <circle cx="832" cy="140" r="13" fill="#DFF4EF"/>
  <text x="832" y="144" text-anchor="middle" fill="#147D68" font-family="Inter, sans-serif" font-size="10" font-weight="700">04</text>
  <text x="854" y="145" fill="#64748B" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing=".7">下游影响</text>
  <text x="826" y="180" fill="#172B4D" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700">估值 · 条款 · 投决</text>
  <text x="826" y="207" fill="#64748B" font-family="Inter, -apple-system, sans-serif" font-size="12">保留不确定性和下一步核验</text>

  <text x="38" y="278" fill="#718096" font-family="Inter, -apple-system, sans-serif" font-size="11">证据不足时保留缺口，不用一个看似完整的答案掩盖未知。</text>
</svg>